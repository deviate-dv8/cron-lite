services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3333:3333"
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend/:/app
      - /app/node_modules
      - ./backend/.env.docker:/app/.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
  # frontend:

  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: cron-lite
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cron-lite"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis: 
    image: redis:latest
    ports:
      - '6380:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:



